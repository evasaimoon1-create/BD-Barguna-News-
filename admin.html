
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BD Barguna News Admin</title>
<style>
body{font-family:Arial;background:#f2f4f7;padding:15px}
main{max-width:600px;margin:auto;background:white;padding:20px;border-radius:10px}
input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;font-size:16px}
button{background:#b00020;color:white;border:0;border-radius:6px}
</style>
</head>
<body>
<main>
<h2>BD Barguna News – Admin</h2>
<p>নতুন খবর প্রকাশ করুন</p>
<input id="token" type="password" placeholder="GitHub Token">
<input id="title" placeholder="খবরের শিরোনাম">
<input id="category" placeholder="বিভাগ">
<textarea id="details" rows="7" placeholder="খবরের বিস্তারিত"></textarea>
<button onclick="publish()">সরাসরি খবর প্রকাশ করুন</button>
<p id="status"></p>
</main>
<script>
const owner="evasaimoon1-create";
const repo="BD-Barguna-News-";
let posts=[];

async function load(){
 const r=await fetch("./posts.json?"+Date.now());
 if(r.ok) posts=await r.json();
}
function base64(text){
 const bytes=new TextEncoder().encode(text);
 let binary="";
 bytes.forEach(b=>binary+=String.fromCharCode(b));
 return btoa(binary);
}
async function publish(){
 const token=document.getElementById("token").value.trim();
 const title=document.getElementById("title").value.trim();
 const category=document.getElementById("category").value.trim();
 const details=document.getElementById("details").value.trim();
 const status=document.getElementById("status");
 if(!token||!title||!details){
 status.textContent="সব ঘর পূরণ করুন।";
 return;
 }
 status.textContent="প্রকাশ করা হচ্ছে...";
 try{
 const url="https://api.github.com/repos/"+owner+"/"+repo+"/contents/posts.json";
 const headers={
 Accept:"application/vnd.github+json",
 Authorization:"Bearer "+token,
 "X-GitHub-Api-Version":"2022-11-28"
 };
 const old=await fetch(url+"?ref=main",{headers});
 if(!old.ok) throw new Error("Token বা অনুমতি পরীক্ষা করুন।");
 const file=await old.json();
 posts.unshift({
 title,category,details,
 date:new Date().toLocaleString("bn-BD")
 });
 const result=await fetch(url,{
 method:"PUT",
 headers,
 body:JSON.stringify({
 message:"Publish news",
 content:base64(JSON.stringify(posts,null,2)),
 sha:file.sha,
 branch:"main"
 })
 });
 if(!result.ok) throw new Error("প্রকাশ করা যায়নি।");
 status.textContent="সফল! খবর প্রকাশ হয়েছে।";
 document.getElementById("title").value="";
 document.getElementById("category").value="";
 document.getElementById("details").value="";
 document.getElementById("token").value="";
 }catch(e){
 status.textContent="সমস্যা: "+e.message;
 }
}
load();
</script>
</body>
</html>
