

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BD Barguna News</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{background:#b00020;color:white;padding:20px;text-align:center}
nav{background:#222;padding:12px;text-align:center}
nav a{color:white;text-decoration:none;margin:8px}
main{max-width:850px;margin:20px auto;padding:12px}
article{background:white;padding:16px;margin:15px 0;border-radius:8px}
h2{color:#b00020}
.date{color:#777;font-size:13px}
footer{background:#222;color:white;text-align:center;padding:18px}
</style>
</head>
<body>
<header>
<h1>BD Barguna News</h1>
<p>সত্যের সন্ধানে, বরগুনার পাশে</p>
</header>
<nav>
<a href="./">হোম</a>
<a href="#news">সর্বশেষ খবর</a>
<a href="#contact">যোগাযোগ</a>
</nav>
<main>
<h2 id="news">সর্বশেষ সংবাদ</h2>
<div id="news-list">খবর লোড হচ্ছে...</div>
</main>
<footer id="contact">
<p>BD Barguna News</p>
<p>ইমেইল: mdsaimoon518@gmail.com</p>
</footer>
<script>
fetch('./posts.json?time='+Date.now())
.then(response=>{
 if(!response.ok) throw new Error('খবর পাওয়া যায়নি');
 return response.json();
})
.then(posts=>{
 const list=document.getElementById('news-list');
 if(!Array.isArray(posts)||posts.length===0){
  list.textContent='এখনো কোনো খবর প্রকাশ করা হয়নি।';
  return;
 }
 list.innerHTML='';
 posts.forEach(post=>{
  const article=document.createElement('article');
  const title=document.createElement('h2');
  title.textContent=post.title||'শিরোনাম নেই';
  const category=document.createElement('p');
  category.textContent=post.category||'বরগুনা';
  const details=document.createElement('p');
  details.textContent=post.details||'';
  const date=document.createElement('p');
  date.className='date';
  date.textContent=post.date||'';
  article.append(title,category,details,date);
  list.appendChild(article);
 });
})
.catch(()=>{
 document.getElementById('news-list').textContent='খবর লোড করা যায়নি। পরে আবার চেষ্টা করুন।';
});
</script>
</body>
</html>
