<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BD Barguna News</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{background:#b00020;color:white;padding:20px;text-align:center}
nav{background:#222;padding:12px;text-align:center}
nav a{color:white;text-decoration:none;margin:8px}
main{max-width:850px;margin:20px auto;padding:12px}
article{background:white;padding:16px;margin:15px 0;border-radius:8px}
h2{color:#b00020}
.date{color:#777;font-size:13px}
.breaking{display:inline-block;background:#b00020;color:white;padding:5px 9px;border-radius:4px;font-weight:bold}
.news-image{width:100%;height:auto;max-height:480px;object-fit:cover;border-radius:7px;margin:10px 0}
.video-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:7px;margin:10px 0}
footer{background:#222;color:white;text-align:center;padding:18px}
</style>
</head>
<body>
<header><h1>BD Barguna News</h1><p>সত্যের সন্ধানে, বরগুনার পাশে</p></header>
<nav><a href="./">হোম</a><a href="#news">সর্বশেষ খবর</a><a href="#contact">যোগাযোগ</a></nav>
<main><h2 id="news">সর্বশেষ সংবাদ</h2><div id="news-list">খবর লোড হচ্ছে...</div></main>
<footer id="contact"><p>BD Barguna News</p><p>ইমেইল: mdsaimoon518@gmail.com</p></footer>
<script>
function youtubeEmbed(value){
 try{
  const u=new URL(value);
  let id="";
  if(u.hostname==="youtu.be")id=u.pathname.slice(1);
  else if(u.hostname==="www.youtube.com"||u.hostname==="youtube.com"||u.hostname==="m.youtube.com"){
   if(u.pathname==="/watch")id=u.searchParams.get("v")||"";
   else if(u.pathname.startsWith("/embed/"))id=u.pathname.split("/")[2]||"";
   else if(u.pathname.startsWith("/shorts/"))id=u.pathname.split("/")[2]||"";
  }
  return /^[A-Za-z0-9_-]{11}$/.test(id)?"https://www.youtube-nocookie.com/embed/"+id:"";
 }catch(e){return "";}
}
fetch("./posts.json?time="+Date.now())
.then(r=>{if(!r.ok)throw new Error("খবর পাওয়া যায়নি");return r.json();})
.then(posts=>{
 const list=document.getElementById("news-list");
 if(!Array.isArray(posts)||!posts.length){list.textContent="এখনো কোনো খবর প্রকাশ করা হয়নি।";return;}
 list.replaceChildren();
 posts.forEach(post=>{
  const article=document.createElement("article");
  if(post.breaking){const tag=document.createElement("span");tag.className="breaking";tag.textContent="ব্রেকিং নিউজ";article.appendChild(tag);}
  const title=document.createElement("h2");title.textContent=post.title||"শিরোনাম নেই";
  const category=document.createElement("p");category.textContent=post.category||"বরগুনা";
  article.append(title,category);
  if(typeof post.image==="string"&&/^https:\/\//i.test(post.image)){
   const img=document.createElement("img");img.className="news-image";img.src=post.image;img.alt=post.title||"সংবাদের ছবি";img.loading="lazy";img.onerror=()=>img.remove();article.appendChild(img);
  }
  const details=document.createElement("p");details.textContent=post.details||"";article.appendChild(details);
  const embed=typeof post.video==="string"?youtubeEmbed(post.video):"";
  if(embed){const frame=document.createElement("iframe");frame.className="video-frame";frame.src=embed;frame.title="সংবাদ ভিডিও";frame.loading="lazy";frame.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";frame.allowFullscreen=true;article.appendChild(frame);}
  const date=document.createElement("p");date.className="date";date.textContent=post.date||"";article.appendChild(date);
  list.appendChild(article);
 });
})
.catch(()=>{document.getElementById("news-list").textContent="খবর লোড করা যায়নি। পরে আবার চেষ্টা করুন।";});
</script>
</body>
</html>
